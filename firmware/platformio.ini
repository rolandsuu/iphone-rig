; ESP32-S3 Bluetooth mouse + keyboard for the iPhone rig.
; Build:  pio run                 Flash:  pio run -t upload       Serial: pio device monitor
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ; Serial goes out the ESP32-S3's native USB port (the one the Mac sees as
    ; "Espressif"). To use a board's "COM" port (USB-to-serial chip) instead, set 0.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
