[project]
name = "iphone-rig"
version = "0.1.0"
description = "Let Claude Code see and control an iPhone: screen over the Lightning cable, taps over an ESP32 Bluetooth mouse/keyboard."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pyserial>=3.5",
    "pillow>=10",
    "numpy>=1.26",
]

[project.scripts]
rig = "rig.cli:main"
iphone-rig-mcp = "rig.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rig"]
